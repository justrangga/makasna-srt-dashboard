<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#0a0c10" />
  <title>Preview: {{ stream_name }} | Makasna Live Gateway</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }
    body, html {
      width: 100%;
      height: 100%;
      background-color: #050608;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .top-bar {
      min-height: 48px;
      background: rgba(13, 16, 23, 0.95);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 14px;
      z-index: 20;
      flex-wrap: wrap;
      gap: 8px;
    }
    .brand-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }
    .engine-switcher {
      display: flex;
      align-items: center;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 6px;
      padding: 2px;
      gap: 2px;
    }
    .btn-engine {
      background: transparent;
      border: none;
      color: #94a3b8;
      font-size: 11px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 4px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: all 0.2s ease;
      touch-action: manipulation;
    }
    .btn-engine.active-webrtc {
      background: rgba(0, 229, 255, 0.2);
      color: #00e5ff;
      border: 1px solid rgba(0, 229, 255, 0.4);
      box-shadow: 0 0 10px rgba(0, 229, 255, 0.25);
    }
    .btn-engine.active-hls {
      background: rgba(0, 230, 118, 0.2);
      color: #00e676;
      border: 1px solid rgba(0, 230, 118, 0.4);
      box-shadow: 0 0 10px rgba(0, 230, 118, 0.25);
    }
    .badge-live {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: rgba(0, 230, 118, 0.15);
      color: #00e676;
      border: 1px solid rgba(0, 230, 118, 0.4);
      padding: 3px 8px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 700;
    }
    .badge-standby {
      background: rgba(245, 158, 11, 0.15);
      color: #f59e0b;
      border-color: rgba(245, 158, 11, 0.4);
    }
    .badge-error {
      background: rgba(244, 63, 94, 0.15);
      color: #f43f5e;
      border-color: rgba(244, 63, 94, 0.4);
    }
    .pulse-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: currentColor;
      box-shadow: 0 0 6px currentColor;
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
      100% { opacity: 1; transform: scale(1); }
    }
    .stream-label {
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
      font-size: 12px;
      color: #38bdf8;
      max-width: 140px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .btn-action {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #fff;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      touch-action: manipulation;
    }
    .btn-action:active {
      background: rgba(255, 255, 255, 0.2);
    }
    .video-viewport {
      flex: 1;
      position: relative;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
      display: block;
    }
    /* Big Tap-to-Play Overlay for iOS Safari */
    .tap-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(4px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 10;
      padding: 20px;
      text-align: center;
      transition: opacity 0.2s ease;
    }
    .tap-btn-circle {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: rgba(0, 229, 255, 0.2);
      border: 2px solid #00e5ff;
      color: #00e5ff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      margin-bottom: 12px;
      box-shadow: 0 0 24px rgba(0, 229, 255, 0.4);
      padding-left: 4px;
    }
    .tap-title {
      font-size: 15px;
      font-weight: 700;
      color: #fff;
      margin-bottom: 4px;
    }
    .tap-sub {
      font-size: 12px;
      color: #94a3b8;
    }
    .notice-banner {
      position: absolute;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.92);
      border: 1px solid rgba(245, 158, 11, 0.5);
      color: #fbbf24;
      font-size: 11.5px;
      padding: 6px 14px;
      border-radius: 20px;
      backdrop-filter: blur(8px);
      display: none;
      align-items: center;
      gap: 6px;
      z-index: 15;
      box-shadow: 0 4px 16px rgba(0,0,0,0.4);
      max-width: 90%;
      text-align: center;
    }
    .bottom-bar {
      min-height: 52px;
      background: rgba(13, 16, 23, 0.95);
      backdrop-filter: blur(10px);
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 14px;
      z-index: 20;
      flex-wrap: wrap;
      gap: 8px;
    }
    .stats-info {
      font-size: 11.5px;
      color: #94a3b8;
      font-family: ui-monospace, monospace;
    }
    .control-cluster {
      display: flex;
      align-items: center;
      gap: 8px;
    }
  </style>
</head>
<body>

  <!-- Top Bar -->
  <div class="top-bar">
    <div class="brand-title">
      <button class="btn-action" onclick="goBack()" title="Kembali ke Dashboard">
        ← Back
      </button>
      <span class="stream-label">{{ stream_name }}</span>
    </div>

    <!-- Engine Switcher -->
    <div class="engine-switcher">
      <button id="btn-engine-webrtc" class="btn-engine" onclick="switchEngine('webrtc')">
        WebRTC (&lt;0.3s)
      </button>
      <button id="btn-engine-hls" class="btn-engine" onclick="switchEngine('hls')">
        LL-HLS
      </button>
    </div>

    <div id="live-indicator" class="badge-live">
      <span class="pulse-dot"></span>
      <span id="txt-status">INITIALIZING</span>
    </div>
  </div>

  <!-- Video Viewport -->
  <div class="video-viewport" id="viewport" onclick="onViewportClick()">
    <video
      id="player"
      playsinline
      webkit-playsinline
      muted
      autoplay
      preload="auto">
    </video>

    <!-- Fallback / Info Banner -->
    <div id="notice-banner" class="notice-banner">
      <span id="notice-text">Notice</span>
    </div>

    <!-- Tap to Play Overlay (iPhone Safari compliance) -->
    <div id="tap-overlay" class="tap-overlay" onclick="startPlaybackManual(event)">
      <div class="tap-btn-circle">&#9658;</div>
      <div class="tap-title">CLICK OR TAP TO PLAY</div>
      <div class="tap-sub">Select anywhere to initiate live video playout</div>
    </div>
  </div>

  <!-- Bottom Bar Controls -->
  <div class="bottom-bar">
    <div class="stats-info" id="stats-display">
      Engine Initializing...
    </div>
    <div class="control-cluster">
      <button id="btn-audio" class="btn-action" onclick="toggleAudio(event)">
        Unmute
      </button>
      <button class="btn-action" onclick="reloadStream(event)">
        Reload
      </button>
      <button class="btn-action" onclick="toggleFullscreen(event)">
        Fullscreen
      </button>
    </div>
  </div>

  <script>
    const streamName = "{{ stream_name }}";
    const hlsStreamUrl = "/hls/" + encodeURIComponent(streamName) + "/index.m3u8";
    const video = document.getElementById('player');
    const tapOverlay = document.getElementById('tap-overlay');
    const liveIndicator = document.getElementById('live-indicator');
    const txtStatus = document.getElementById('txt-status');
    const statsDisplay = document.getElementById('stats-display');
    const btnAudio = document.getElementById('btn-audio');
    const btnEngineWebRtc = document.getElementById('btn-engine-webrtc');
    const btnEngineHls = document.getElementById('btn-engine-hls');
    const noticeBanner = document.getElementById('notice-banner');
    const noticeText = document.getElementById('notice-text');

    let currentEngine = 'webrtc';
    let hlsInstance = null;
    let peerConnection = null;
    let retryTimer = null;
    let isUserInteracted = false;

    function goBack() {
      if (window.history.length > 1) {
        window.history.back();
      } else {
        window.location.href = "/";
      }
    }

    function showNotice(msg, timeoutMs = 4000) {
      if (!noticeBanner || !noticeText) return;
      noticeText.textContent = msg;
      noticeBanner.style.display = 'inline-flex';
      if (timeoutMs > 0) {
        setTimeout(() => {
          noticeBanner.style.display = 'none';
        }, timeoutMs);
      }
    }

    function setStatus(text, type = 'live') {
      txtStatus.textContent = text;
      liveIndicator.className = 'badge-live';
      if (type === 'standby') {
        liveIndicator.classList.add('badge-standby');
      } else if (type === 'error') {
        liveIndicator.classList.add('badge-error');
      }
    }

    function updateEngineButtons() {
      if (currentEngine === 'webrtc') {
        btnEngineWebRtc.className = 'btn-engine active-webrtc';
        btnEngineHls.className = 'btn-engine';
      } else {
        btnEngineWebRtc.className = 'btn-engine';
        btnEngineHls.className = 'btn-engine active-hls';
      }
    }

    function switchEngine(targetEngine) {
      if (currentEngine === targetEngine && (peerConnection || hlsInstance || video.src)) {
        return;
      }
      currentEngine = targetEngine;
      updateEngineButtons();
      stopAllEngines();
      if (currentEngine === 'webrtc') {
        initWebRtc();
      } else {
        initHls();
      }
    }

    function stopAllEngines() {
      if (retryTimer) {
        clearTimeout(retryTimer);
        retryTimer = null;
      }
      if (peerConnection) {
        try { peerConnection.close(); } catch(e) {}
        peerConnection = null;
      }
      if (hlsInstance) {
        try { hlsInstance.destroy(); } catch(e) {}
        hlsInstance = null;
      }
      video.pause();
      video.srcObject = null;
      video.removeAttribute('src');
      video.load();
    }

    // ---------------------------------------------------------
    // WEBRTC (WHEP) IMPLEMENTATION
    // ---------------------------------------------------------
    async function initWebRtc() {
      updateEngineButtons();
      statsDisplay.textContent = "Connecting WebRTC (WHEP)...";
      setStatus("NEGOTIATING", "standby");

      if (!window.RTCPeerConnection) {
        console.warn("RTCPeerConnection not supported");
        showNotice("Browser tidak mendukung WebRTC. Beralih ke LL-HLS...");
        switchEngine('hls');
        return;
      }

      try {
        const pc = new RTCPeerConnection({
          iceServers: [
            { urls: 'stun:stun.l.google.com:19302' }
          ]
        });
        peerConnection = pc;

        pc.addTransceiver('video', { direction: 'recvonly' });
        pc.addTransceiver('audio', { direction: 'recvonly' });

        pc.ontrack = (evt) => {
          if (video.srcObject !== evt.streams[0]) {
            video.srcObject = evt.streams[0];
            const p = video.play();
            if (p !== undefined) {
              p.then(() => {
                tapOverlay.style.display = 'none';
              }).catch(() => {
                tapOverlay.style.display = 'flex';
              });
            }
          }
          setStatus("LIVE", "live");
          statsDisplay.textContent = "● LIVE (WebRTC · sub-300ms)";
        };

        pc.onconnectionstatechange = () => {
          if (pc.connectionState === 'connected') {
            setStatus("LIVE", "live");
            statsDisplay.textContent = "● LIVE (WebRTC · sub-300ms)";
          } else if (pc.connectionState === 'failed' || pc.connectionState === 'disconnected') {
            setStatus("STANDBY", "standby");
            statsDisplay.textContent = "WebRTC standby: Menunggu sinyal siaran...";
            retryTimer = setTimeout(initWebRtc, 3000);
          }
        };

        const offer = await pc.createOffer();
        await pc.setLocalDescription(offer);

        // Try WHEP proxy first (same port 8080), then fallback to direct port 8889
        const whepUrls = [
          `/whep/${encodeURIComponent(streamName)}/whep`,
          `http://${window.location.hostname}:8889/${encodeURIComponent(streamName)}/whep`
        ];

        let answerSdp = null;
        let lastError = null;

        for (const url of whepUrls) {
          try {
            const resp = await fetch(url, {
              method: 'POST',
              headers: { 'Content-Type': 'application/sdp' },
              body: offer.sdp
            });

            if (resp.ok) {
              answerSdp = await resp.text();
              break;
            } else {
              const errBody = await resp.text();
              try {
                const j = JSON.parse(errBody);
                lastError = j.error || `HTTP ${resp.status}`;
              } catch(e) {
                lastError = `HTTP ${resp.status}`;
              }
            }
          } catch(netErr) {
            lastError = netErr.message;
          }
        }

        if (!answerSdp) {
          throw new Error(lastError || "WHEP endpoint error");
        }

        await pc.setRemoteDescription({ type: 'answer', sdp: answerSdp });

      } catch (err) {
        console.warn("WebRTC startup error:", err.message);
        // Codec mismatch (e.g. stream is H.265 or AAC): MediaMTX returns 'codecs not supported by client'
        if (err.message && err.message.includes('codecs not supported')) {
          showNotice("Stream menggunakan H.265 (HEVC). WebRTC butuh H.264. Mengalihkan ke LL-HLS...", 5000);
          switchEngine('hls');
          return;
        }

        if (err.message && err.message.includes('no stream is available')) {
          setStatus("STANDBY", "standby");
          statsDisplay.textContent = "Standby: Menunggu feed sinyal siaran aktif...";
          tapOverlay.style.display = 'flex';
          retryTimer = setTimeout(initWebRtc, 3000);
          return;
        }

        // Other failure -> fallback to HLS
        showNotice(`WebRTC: ${err.message}. Mengalihkan ke LL-HLS...`, 4000);
        switchEngine('hls');
      }
    }

    // ---------------------------------------------------------
    // HLS IMPLEMENTATION
    // ---------------------------------------------------------
    function initHls() {
      updateEngineButtons();
      statsDisplay.textContent = "Connecting Low-Latency HLS...";
      setStatus("CONNECTING", "standby");

      // 1. Apple Native HLS (iPhone Safari, Mac Safari)
      if (video.canPlayType('application/vnd.apple.mpegurl')) {
        statsDisplay.textContent = "Engine: Apple Native AVPlayer";
        video.src = hlsStreamUrl;

        video.onplaying = () => {
          tapOverlay.style.display = 'none';
          setStatus("LIVE", "live");
          statsDisplay.textContent = "● LIVE (Safari Native HLS · fMP4)";
        };

        video.onerror = () => {
          setStatus("STANDBY", "standby");
          statsDisplay.textContent = "Standby: Menunggu feed sinyal siaran aktif...";
          tapOverlay.style.display = 'flex';
        };

        const p = video.play();
        if (p !== undefined) {
          p.then(() => {
            tapOverlay.style.display = 'none';
          }).catch(() => {
            tapOverlay.style.display = 'flex';
          });
        }
      }
      // 2. HLS.js (Chrome, Firefox, Android, Edge)
      else if (window.Hls && Hls.isSupported()) {
        statsDisplay.textContent = "Engine: Hls.js Low-Latency";
        hlsInstance = new Hls({
          enableWorker: true,
          lowLatencyMode: true,
          backBufferLength: 6,
          maxBufferLength: 4
        });

        hlsInstance.attachMedia(video);

        hlsInstance.on(Hls.Events.MEDIA_ATTACHED, () => {
          hlsInstance.loadSource(hlsStreamUrl);
        });

        hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => {
          const p = video.play();
          if (p !== undefined) {
            p.then(() => {
              tapOverlay.style.display = 'none';
            }).catch(() => {
              tapOverlay.style.display = 'flex';
            });
          }
        });

        hlsInstance.on(Hls.Events.FRAG_LOADED, (evt, data) => {
          setStatus("LIVE", "live");
          const res = video.videoWidth && video.videoHeight ? `${video.videoWidth}x${video.videoHeight}` : '1080p';
          statsDisplay.textContent = `● LIVE (${res} | LL-HLS fMP4)`;
        });

        hlsInstance.on(Hls.Events.ERROR, (evt, data) => {
          if (data.fatal) {
            const is404 = data.response && (data.response.code === 404 || data.response.code === 0);
            if (is404) {
              setStatus("STANDBY", "standby");
              statsDisplay.textContent = "Standby: Menunggu feed sinyal siaran aktif...";
            } else {
              setStatus("RECONNECTING", "standby");
              statsDisplay.textContent = "Stream interrupted, reconnecting...";
            }
            tapOverlay.style.display = 'flex';
            retryTimer = setTimeout(initHls, 3000);
          }
        });
      } else {
        statsDisplay.textContent = "Browser tidak mendukung WebRTC maupun HLS playback.";
      }
    }

    function startPlaybackManual(e) {
      if (e) e.stopPropagation();
      isUserInteracted = true;
      video.muted = true;
      const p = video.play();
      if (p !== undefined) {
        p.then(() => {
          tapOverlay.style.display = 'none';
          setStatus("LIVE", "live");
        }).catch((err) => {
          console.warn("Manual play error", err);
          video.load();
          video.play().catch(() => {});
        });
      }
    }

    function onViewportClick() {
      if (video.paused) {
        startPlaybackManual();
      } else {
        video.pause();
        tapOverlay.style.display = 'flex';
      }
    }

    function toggleAudio(e) {
      if (e) e.stopPropagation();
      video.muted = !video.muted;
      if (video.muted) {
        btnAudio.innerHTML = "Unmute";
        btnAudio.style.borderColor = "rgba(255,255,255,0.15)";
        btnAudio.style.color = "#fff";
      } else {
        btnAudio.innerHTML = "Mute";
        btnAudio.style.borderColor = "var(--cyan, #00e5ff)";
        btnAudio.style.color = "#00e5ff";
      }
    }

    function reloadStream(e) {
      if (e) e.stopPropagation();
      setStatus("RELOADING", "standby");
      statsDisplay.textContent = "Reloading feed...";
      stopAllEngines();
      if (currentEngine === 'webrtc') {
        initWebRtc();
      } else {
        initHls();
      }
    }

    function toggleFullscreen(e) {
      if (e) e.stopPropagation();
      if (!document.fullscreenElement && !document.webkitFullscreenElement) {
        if (video.requestFullscreen) {
          video.requestFullscreen();
        } else if (video.webkitRequestFullscreen) {
          video.webkitRequestFullscreen();
        } else if (video.webkitEnterFullscreen) {
          video.webkitEnterFullscreen();
        }
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen();
        } else if (document.webkitExitFullscreen) {
          document.webkitExitFullscreen();
        }
      }
    }

    // Auto-boot on load: inspect URL query ?engine=hls or ?engine=webrtc
    window.addEventListener('DOMContentLoaded', () => {
      const params = new URLSearchParams(window.location.search);
      const requestedEngine = params.get('engine');
      if (requestedEngine === 'hls') {
        currentEngine = 'hls';
        initHls();
      } else {
        currentEngine = 'webrtc';
        initWebRtc();
      }
    });
  </script>
</body>
</html>
