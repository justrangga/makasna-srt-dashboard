<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#0a0c10" />
  <title>Preview: {{ stream_name }} | Makasna Live Gateway</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }
    body, html {
      width: 100%;
      height: 100%;
      background-color: #050608;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .top-bar {
      height: 48px;
      background: rgba(13, 16, 23, 0.95);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 14px;
      z-index: 20;
    }
    .brand-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }
    .badge-live {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: rgba(0, 230, 118, 0.15);
      color: #00e676;
      border: 1px solid rgba(0, 230, 118, 0.4);
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 10.5px;
      font-weight: 700;
    }
    .pulse-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #00e676;
      box-shadow: 0 0 6px #00e676;
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
      100% { opacity: 1; transform: scale(1); }
    }
    .stream-label {
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
      font-size: 12px;
      color: #38bdf8;
      max-width: 140px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .btn-action {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #fff;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      touch-action: manipulation;
    }
    .btn-action:active {
      background: rgba(255, 255, 255, 0.2);
    }
    .video-viewport {
      flex: 1;
      position: relative;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
      display: block;
    }
    /* Big Tap-to-Play Overlay for iOS Safari */
    .tap-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(4px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 10;
      padding: 20px;
      text-align: center;
      transition: opacity 0.2s ease;
    }
    .tap-btn-circle {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: rgba(0, 229, 255, 0.2);
      border: 2px solid #00e5ff;
      color: #00e5ff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      margin-bottom: 12px;
      box-shadow: 0 0 24px rgba(0, 229, 255, 0.4);
      padding-left: 4px;
    }
    .tap-title {
      font-size: 15px;
      font-weight: 700;
      color: #fff;
      margin-bottom: 4px;
    }
    .tap-sub {
      font-size: 12px;
      color: #94a3b8;
    }
    .bottom-bar {
      height: 52px;
      background: rgba(13, 16, 23, 0.95);
      backdrop-filter: blur(10px);
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 14px;
      z-index: 20;
    }
    .stats-info {
      font-size: 11.5px;
      color: #94a3b8;
      font-family: ui-monospace, monospace;
    }
    .control-cluster {
      display: flex;
      align-items: center;
      gap: 8px;
    }
  </style>
</head>
<body>

  <!-- Top Bar -->
  <div class="top-bar">
    <div class="brand-title">
      <button class="btn-action" onclick="goBack()" title="Kembali ke Dashboard">
        ← Back
      </button>
      <span class="stream-label">{{ stream_name }}</span>
    </div>
    <div id="live-indicator" class="badge-live">
      <span class="pulse-dot"></span>
      <span id="txt-status">CONNECTING</span>
    </div>
  </div>

  <!-- Video Viewport -->
  <div class="video-viewport" id="viewport" onclick="onViewportClick()">
    <video
      id="player"
      playsinline
      webkit-playsinline
      muted
      autoplay
      preload="auto">
    </video>

    <!-- Tap to Play Overlay (iPhone Safari compliance) -->
    <div id="tap-overlay" class="tap-overlay" onclick="startPlaybackManual(event)">
      <div class="tap-btn-circle">▶</div>
      <div class="tap-title">KLIK / TAP UNTUK MEMUTAR</div>
      <div class="tap-sub">Tekan di mana saja untuk mengaktifkan video preview</div>
    </div>
  </div>

  <!-- Bottom Bar Controls -->
  <div class="bottom-bar">
    <div class="stats-info" id="stats-display">
      HLS Engine Initializing...
    </div>
    <div class="control-cluster">
      <button id="btn-audio" class="btn-action" onclick="toggleAudio(event)">
        🔇 Unmute
      </button>
      <button class="btn-action" onclick="reloadStream(event)">
        ↻ Reload
      </button>
      <button class="btn-action" onclick="toggleFullscreen(event)">
        ⛶ Full
      </button>
    </div>
  </div>

  <script>
    const streamName = "{{ stream_name }}";
    const streamUrl = "/hls/" + encodeURIComponent(streamName) + "/index.m3u8";
    const video = document.getElementById('player');
    const tapOverlay = document.getElementById('tap-overlay');
    const txtStatus = document.getElementById('txt-status');
    const statsDisplay = document.getElementById('stats-display');
    const btnAudio = document.getElementById('btn-audio');

    let hlsInstance = null;
    let isUserInteracted = false;

    function goBack() {
      if (window.history.length > 1) {
        window.history.back();
      } else {
        window.location.href = "/";
      }
    }

    function initPlayer() {
      if (hlsInstance) {
        try { hlsInstance.destroy(); } catch (e) {}
        hlsInstance = null;
      }

      // 1. Apple Native HLS (iPhone Safari, iPad, Mac Safari)
      if (video.canPlayType('application/vnd.apple.mpegurl')) {
        statsDisplay.textContent = "Engine: Apple Native AVPlayer";
        video.src = streamUrl;

        video.addEventListener('playing', () => {
          tapOverlay.style.display = 'none';
          txtStatus.textContent = "LIVE";
          txtStatus.style.color = "#00e676";
          statsDisplay.textContent = "● LIVE (Safari Native HLS)";
        });

        video.addEventListener('pause', () => {
          if (!video.ended) {
            tapOverlay.style.display = 'flex';
          }
        });

        video.addEventListener('error', (e) => {
          console.warn("Native video error", e);
          statsDisplay.textContent = "Waiting stream feed...";
          txtStatus.textContent = "OFFLINE";
          txtStatus.style.color = "#f43f5e";
          tapOverlay.style.display = 'flex';
        });

        // Attempt silent autoplay
        const p = video.play();
        if (p !== undefined) {
          p.then(() => {
            tapOverlay.style.display = 'none';
          }).catch(() => {
            tapOverlay.style.display = 'flex';
          });
        }
      }
      // 2. HLS.js (Chrome, Firefox, Android, Edge)
      else if (window.Hls && Hls.isSupported()) {
        statsDisplay.textContent = "Engine: Hls.js Low-Latency";
        hlsInstance = new Hls({
          enableWorker: true,
          lowLatencyMode: true,
          backBufferLength: 6,
          maxBufferLength: 4
        });

        hlsInstance.attachMedia(video);

        hlsInstance.on(Hls.Events.MEDIA_ATTACHED, () => {
          hlsInstance.loadSource(streamUrl);
        });

        hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => {
          const p = video.play();
          if (p !== undefined) {
            p.then(() => {
              tapOverlay.style.display = 'none';
            }).catch(() => {
              tapOverlay.style.display = 'flex';
            });
          }
        });

        hlsInstance.on(Hls.Events.FRAG_LOADED, (evt, data) => {
          txtStatus.textContent = "LIVE";
          txtStatus.style.color = "#00e676";
          const res = video.videoWidth && video.videoHeight ? `${video.videoWidth}x${video.videoHeight}` : '1080p';
          statsDisplay.textContent = `● LIVE (${res} | fMP4)`;
        });

        hlsInstance.on(Hls.Events.ERROR, (evt, data) => {
          if (data.fatal) {
            const is404 = data.response && (data.response.code === 404 || data.response.code === 0);
            if (is404) {
              txtStatus.textContent = "STANDBY";
              txtStatus.style.color = "#f59e0b";
              statsDisplay.textContent = "Standby: Menunggu feed sinyal siaran aktif...";
            } else {
              txtStatus.textContent = "RECONNECTING";
              txtStatus.style.color = "#f59e0b";
              statsDisplay.textContent = "Stream interrupted, reconnecting...";
            }
            tapOverlay.style.display = 'flex';
            setTimeout(initPlayer, 3000);
          }
        });
      } else {
        statsDisplay.textContent = "Browser tidak mendukung HLS playback.";
      }
    }

    function startPlaybackManual(e) {
      if (e) e.stopPropagation();
      isUserInteracted = true;
      video.muted = true; // Start muted for instant autoplay unlock
      const p = video.play();
      if (p !== undefined) {
        p.then(() => {
          tapOverlay.style.display = 'none';
          txtStatus.textContent = "LIVE";
        }).catch((err) => {
          console.warn("Manual play error", err);
          // Try reloading source
          video.load();
          video.play().catch(() => {});
        });
      }
    }

    function onViewportClick() {
      if (video.paused) {
        startPlaybackManual();
      } else {
        // Toggle play/pause
        video.pause();
        tapOverlay.style.display = 'flex';
      }
    }

    function toggleAudio(e) {
      if (e) e.stopPropagation();
      video.muted = !video.muted;
      if (video.muted) {
        btnAudio.innerHTML = "🔇 Unmute";
        btnAudio.style.borderColor = "rgba(255,255,255,0.15)";
        btnAudio.style.color = "#fff";
      } else {
        btnAudio.innerHTML = "🔊 Mute";
        btnAudio.style.borderColor = "var(--cyan, #00e5ff)";
        btnAudio.style.color = "#00e5ff";
      }
    }

    function reloadStream(e) {
      if (e) e.stopPropagation();
      txtStatus.textContent = "RELOADING";
      statsDisplay.textContent = "Reloading feed...";
      initPlayer();
    }

    function toggleFullscreen(e) {
      if (e) e.stopPropagation();
      if (!document.fullscreenElement && !document.webkitFullscreenElement) {
        if (video.requestFullscreen) {
          video.requestFullscreen();
        } else if (video.webkitRequestFullscreen) {
          video.webkitRequestFullscreen();
        } else if (video.webkitEnterFullscreen) {
          // iOS Safari native video fullscreen
          video.webkitEnterFullscreen();
        }
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen();
        } else if (document.webkitExitFullscreen) {
          document.webkitExitFullscreen();
        }
      }
    }

    // Auto-boot on load
    window.addEventListener('DOMContentLoaded', () => {
      initPlayer();
    });
  </script>
</body>
</html>
