<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Sign In · Makasna Live Transport Gateway</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
:root {
  color-scheme: dark;
  --bg: #09090b;
  --panel: #121215;
  --border: #27272a;
  --muted: #a1a1aa;
  --text: #f4f4f5;
  --blue: #3b82f6;
  --cyan: #00e5ff;
  --red: #ef4444;
}
* { box-sizing: border-box; margin:0; padding:0; -webkit-tap-highlight-color: transparent; }
body {
  margin: 0;
  min-height: 100vh;
  display: grid;
  place-items: center;
  padding: 16px;
  background: var(--bg);
  color: var(--text);
  font: 14px 'Inter', -apple-system, sans-serif;
}
.card {
  width: min(420px, 100%);
  padding: 32px 24px;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 16px;
  box-shadow: 0 24px 80px rgba(0,0,0,0.6);
}
.brand-icon {
  width: 38px;
  height: 38px;
  background: linear-gradient(135deg, var(--blue), var(--cyan));
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 700;
  font-size: 20px;
  color: #fff;
  margin-bottom: 20px;
}
.eyebrow {
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.12em;
  color: var(--cyan);
  font-weight: 600;
}
h1 {
  margin: 6px 0 6px;
  font-size: 22px;
  font-weight: 700;
}
p.sub {
  color: var(--muted);
  font-size: 13px;
  margin-bottom: 24px;
}
.fields {
  display: grid;
  gap: 16px;
}
label {
  display: grid;
  gap: 6px;
  font-size: 12px;
  font-weight: 600;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.06em;
}
input, button {
  width: 100%;
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 11px 14px;
  font: inherit;
}
input {
  background: #09090b;
  color: #fff;
  font-size: 14px;
}
input:focus {
  outline: none;
  border-color: var(--cyan);
}
button {
  margin-top: 6px;
  cursor: pointer;
  background: var(--blue);
  color: #fff;
  font-weight: 600;
  border: none;
  transition: background 0.15s;
}
button:hover { background: #1d4ed8; }
.error {
  margin: 0 0 18px;
  padding: 10px 14px;
  border-left: 3px solid var(--red);
  background: rgba(239, 68, 68, 0.1);
  color: #fca5a5;
  border-radius: 0 6px 6px 0;
  font-size: 13px;
}
</style>
</head>
<body>
<main class="card">
  <div class="brand-icon">M</div>
  <div class="eyebrow">Enterprise Live Video Transport</div>
  <h1>Makasna Gateway</h1>
  <p class="sub">Sign in to manage routes, fan-out, and telemetry</p>
  {% if error %}
    <div class="error" role="alert">{{ error }}</div>
  {% endif %}
  <form method="post" class="fields">
    <label>Username
      <input name="username" type="text" required autofocus autocomplete="username" placeholder="admin">
    </label>
    <label>Password
      <input name="password" type="password" required autocomplete="current-password" placeholder="••••••••">
    </label>
    <button type="submit">Sign In</button>
  </form>
</main>
</body>
</html>
